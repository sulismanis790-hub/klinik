<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | Klinik Sehat</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
<nav class="navbar navbar-dark"><div class="container nav-wrap"><a class="navbar-brand fw-semibold" href="index.html">Klinik Sehat</a><a class="btn btn-light btn-sm" href="index.html">Beranda</a></div></nav>
<main class="container login-wrap"><div class="card-modern login-card"><div class="brand-mark mx-auto mb-3">KS</div><h4 class="text-center mb-1">Login Sistem Klinik</h4><p class="text-center text-muted mb-4">Masuk untuk mengakses dashboard pengelolaan klinik.</p><form id="formLogin" action="dashboard.html"><label class="form-label" for="username">Username</label><input id="username" class="form-control mb-3" placeholder="Masukkan username" required><label class="form-label" for="password">Password</label><input id="password" type="password" class="form-control mb-3" placeholder="Masukkan password" required><label class="form-label" for="role">Login Sebagai</label><select id="role" class="form-select mb-3"><option>Dokter</option><option>Admin</option></select><div class="form-check mb-3"><input id="ingat" class="form-check-input" type="checkbox"><label class="form-check-label" for="ingat">Ingat saya</label></div><button class="btn btn-primary w-100" type="submit">Masuk</button></form><div class="text-center mt-3"><a href="#">Lupa Password?</a></div><a class="d-block text-center mt-3" href="index.html">Kembali ke Beranda</a></div></main>
<footer class="text-white text-center p-3">&copy; 2026 Klinik Sehat</footer>
</body>
</html>
